name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Unit Tests & Coverage (IE2)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pruebas unitarias y cobertura
        env:
          PYTHONPATH: ./app
          SQLALCHEMY_DATABASE_URI: sqlite:///./test_ci.db
        run: |
          pytest -v tests \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=40

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: SCA & SAST (IE3)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: SCA - pip-audit (dependencias)
        run: pip-audit -r requirements.txt --desc
        continue-on-error: false

      - name: SAST - Bandit (código estático)
        run: |
          bandit -r app -ll -f json -o bandit-report.json
          bandit -r app -ll

      - name: Trivy (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          skip-dirs: node_modules,venv,.git

  code-analysis:
    name: SAST - Calidad de código (IE3)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Configurar Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Flake8 (errores sintácticos y referencias)
        run: flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: SonarCloud (opcional si hay SONAR_TOKEN)
        uses: SonarSource/sonarcloud-github-action@master
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=eva02-api
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=app
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.exclusions=**/tests/**,**/migrations/**,**/__pycache__/**
            -Dsonar.python.version=3.9

  docker-lint:
    name: Análisis Dockerfile (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  build:
    name: Build Docker Image (IE1)
    runs-on: ubuntu-latest
    needs: [test, security, code-analysis, docker-lint]
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: eva02-api:latest
          load: true

      - name: Trivy (imagen Docker)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: eva02-api:latest
          severity: CRITICAL,HIGH
          exit-code: 1

  deploy:
    name: Deploy simulado (IE4)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Levantar Docker Compose
        run: docker compose up -d --build --wait

      - name: Comprobar API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/openapi.json; then
              echo "API OK"
              exit 0
            fi
            echo "Esperando API... $i/30"
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Bajar contenedores
        if: always()
        run: docker compose down -v
