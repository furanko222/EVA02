name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Unit Tests (IE2)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install passlib[bcrypt] PyJWT psycopg2-binary

      - name: Ejecutar pytest
        env:
          PYTHONPATH: app
        run: pytest -v tests

  security:
    name: Security Analysis (IE3)
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: Auditar dependencias pip
        run: pip-audit -r requirements.txt --strict

      - name: Análisis estático (Bandit)
        run: bandit -r app -ll

      - name: Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

  build:
    name: Build Docker Image (IE1)
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: eva02-api:latest
          load: true

      - name: Trivy (imagen)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: eva02-api:latest
          severity: CRITICAL,HIGH
          exit-code: 1

  deploy:
    name: Deploy simulado (IE4)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Levantar Docker Compose
        run: docker compose up -d --build

      - name: Comprobar API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/openapi.json; then
              echo "API OK"
              exit 0
            fi
            echo "Esperando... $i"
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Bajar contenedores
        if: always()
        run: docker compose down -v