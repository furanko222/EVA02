version: "3.3"

services:
  db:
    image: postgres:15.1
    ports: 
      - "5432:5432"
    environment: 
      POSTGRES_PASSWORD: pass 
      POSTGRES_DB: test_db
    volumes: 
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    app: 
      build: .
      ports:
        - "8000:8000"
      environment: 
        SQLALCHEMY_DATABASE_URI: postgresql://postgres:pass@db:5432/test_db
        SECRET_KEY: development
      depends_on:
        db: 
          condition: service_healthy
          