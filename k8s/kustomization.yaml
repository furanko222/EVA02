apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eva02

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - rbac.yaml
  - service-db.yaml
  - deployment-db.yaml
  - service-api.yaml
  - deployment-api.yaml
  - ingress.yaml

commonLabels:
  app: eva02
  managed-by: kustomize
  environment: production

commonAnnotations:
  description: "EVA02 Microservice - Production Deployment"
  version: "1.0"

images:
  - name: eva02-api
    newTag: latest

replicas:
  - name: eva02-api
    count: 3

# Patches para difereniar entre dev/staging/prod
# Si necesitas overrides específicos, crear una carpeta overlays/
