apiVersion: v1
kind: Service
metadata:
  name: eva02-service
  namespace: eva02
  labels:
    app: eva02-api
spec:
  type: LoadBalancer  # Cambiar a ClusterIP si usas Ingress
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: eva02-api
  sessionAffinity: None
  loadBalancerSourceRanges: []  # Restricciones de IP si se requiere
