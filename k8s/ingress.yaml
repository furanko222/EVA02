apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eva02-ingress
  namespace: eva02
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod  # Si usas cert-manager
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: api.example.com  # Cambiar a tu dominio
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: eva02-service
            port:
              number: 80
  tls:
  - hosts:
    - api.example.com
    secretName: eva02-tls
