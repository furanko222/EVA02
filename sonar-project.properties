# SonarQube Configuration for EVA02
sonar.projectKey=eva02-api
sonar.projectName=EVA02 API
sonar.projectVersion=1.0.0

# Source code
sonar.sources=app
sonar.tests=tests
sonar.inclusions=app/**/*.py
sonar.exclusions=**/tests/**,**/migrations/**,**/__pycache__/**,**/venv/**

# Python-specific settings
sonar.python.version=3.9
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.pylint.reportPath=pylint-report.txt

# Test coverage
sonar.coverage.exclusions=**/tests/**,**/__pycache__/**

# Code quality gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Language
sonar.language=py

# Enable/disable rules
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S101
sonar.issue.ignore.multicriteria.e1.resourceKey=**
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/migrations/**
